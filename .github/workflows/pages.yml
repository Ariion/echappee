name: Publier le jeu (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Activer GitHub Pages (si le jeton le permet)
        continue-on-error: true
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test tests/Echappee.Core.Tests --configuration Release
      - run: dotnet publish src/Echappee.Web -c Release -o out
      # le site vit sous /<nom-du-dépôt>/ : on ajuste la balise <base>
      - name: Ajuster le chemin de base
        run: |
          sed -i "s#<base href=\"/\" />#<base href=\"/${GITHUB_REPOSITORY#*/}/\" />#" out/wwwroot/index.html
          touch out/wwwroot/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/wwwroot
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
